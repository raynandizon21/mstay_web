<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Main Stay Hotel · Clark Freeport Zone, Pampanga</title>
    <meta name="description" content="A new studio hotel in Clark Freeport Zone, Pampanga — 101 spacious rooms, 10 minutes to Clark Airport, golf traveler services and Damso Korean restaurant." />

    <!-- Link previews (Facebook, Messenger, KakaoTalk, Viber, X) -->
    <!-- TODO: once the site has a domain, make og:image a full URL (e.g. https://your-domain.com/og-image.jpg) and add og:url — Facebook ignores relative image paths -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Main Stay Hotel" />
    <meta property="og:title" content="Main Stay Hotel · Clark Freeport Zone, Pampanga" />
    <meta property="og:description" content="101 spacious studio rooms inside Clark Freeport Zone — 10 minutes to Clark Airport, golf traveler services, Damso Korean restaurant and a Korean market on site." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Main Stay Hotel building in Clark Freeport Zone" />
    <meta property="og:locale" content="en_PH" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Main Stay Hotel · Clark Freeport Zone, Pampanga" />
    <meta name="twitter:description" content="101 spacious studio rooms inside Clark Freeport Zone — 10 minutes to Clark Airport." />
    <meta name="twitter:image" content="/og-image.jpg" />
    <meta name="theme-color" content="#111111" />

    <!-- Google Fonts: Inter Tight (display) + Instrument Serif (italic accents) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Paint the intro's dark background before React loads (no white flash). Mirrors IntroLoader's skip rules. -->
    <style>html.intro-pending, html.intro-pending body { background: #0B0B0B !important; }</style>
    <script>
      try {
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches && sessionStorage.getItem('mstay-intro-seen') !== '1') {
          document.documentElement.classList.add('intro-pending');
        }
      } catch (e) {}
    </script>

    <!-- Favicon: Main Stay Hotel logo -->
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- Schema.org structured data (Google search / Maps). Keep in sync with HOTEL_INFO in src/data/ombaraData.ts -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Hotel",
        "name": "M Stay Hotel",
        "alternateName": "Main Stay Hotel",
        "description": "A new studio hotel inside Clark Freeport Zone, opened in 2022. 101 spacious studio rooms, golf traveler services, Damso Korean restaurant and a Korean market on the ground floor.",
        "image": "/og-image.jpg",
        "numberOfRooms": 101,
        "priceRange": "₱4,300 – ₱4,700 per night",
        "telephone": "+63454997837",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Clark Terrace Building, Lot 2 Block 1, The Villages, Prince Balagtas Avenue",
          "addressLocality": "Clark Freeport Zone",
          "addressRegion": "Pampanga",
          "addressCountry": "PH"
        },
        "hasMap": "https://www.google.com/maps/search/?api=1&query=CLARK+M+STAY+HOTEL+Clark+Terrace+Building"
      }
    </script>
  </head>
  <body class="bg-white text-[#111111] font-sans antialiased selection:bg-[#111111]/20 selection:text-[#6B6B6B] overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
