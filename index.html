<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Main Stay Hotel</title>
    <meta name="description" content="Ombara — Luxury Hotel & Resort. Experience elevated living with thoughtfully designed residences, refined comfort, and exclusive resort-style amenities." />
    <meta property="og:title" content="Ombara — Luxury Hotel & Resort" />
    <meta property="og:description" content="Experience elevated living with thoughtfully designed residences, refined comfort, and exclusive resort-style amenities." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Google Fonts: Inter Tight (display) + Instrument Serif (italic accents) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Paint the intro's dark background before React loads (no white flash). Mirrors IntroLoader's skip rules. -->
    <style>html.intro-pending, html.intro-pending body { background: #0B0B0B !important; }</style>
    <script>
      try {
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches && sessionStorage.getItem('mstay-intro-seen') !== '1') {
          document.documentElement.classList.add('intro-pending');
        }
      } catch (e) {}
    </script>

    <!-- Favicon: Main Stay Hotel logo -->
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- Schema.org JSON-LD Structured Data for Ombara -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Hotel",
        "name": "Ombara Luxury Hotel & Resort",
        "description": "Experience elevated living with thoughtfully designed residences, refined comfort, and exclusive resort-style amenities.",
        "starRating": {
          "@type": "Rating",
          "ratingValue": "5"
        },
        "priceRange": "$$$$",
        "telephone": "+62 (812) 3456-7890",
        "email": "info@on3-step.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Coastal Horizon Boulevard, Mentawai Islands",
          "addressLocality": "West Sumatra",
          "addressCountry": "ID"
        }
      }
    </script>
  </head>
  <body class="bg-white text-[#111111] font-sans antialiased selection:bg-[#111111]/20 selection:text-[#6B6B6B] overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
